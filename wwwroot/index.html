<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flag Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="images/FLAG (1).png" alt="Flag Quiz Logo" class="logo-img" />
            <h1>Flag Quiz Game</h1>
        </div>
        <p class="welcome">
            Welcome to the ultimate flag challenge! Test your knowledge of world
            flags.
        </p>

        <button class="start-btn" onclick="window.location.href='continent.html'">Start Game</button>

        <div class="settings">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
