<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose continent</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="continent-container">
        <button class="back-btn">← Back</button>

        <h1 class="continent-title">Choose a Continent</h1>
        <p class="continent-subtitle">
            Select which continent you want to play with:
        </p>
        <div class="continent-buttons">
            <button class="continent-btn africa">Africa</button>
            <button class="continent-btn asia">Asia</button>
            <button class="continent-btn europe">Europe</button>
            <button class="continent-btn north-america">North America</button>
            <button class="continent-btn south-america">South America</button>
            <button class="continent-btn australia">Australia</button>
            <button class="continent-btn antarctica">Antarctica</button>
            <button class="continent-btn all">All Continents</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
