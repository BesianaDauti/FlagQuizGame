<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose level</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="level-container">
        <button class="back-btn1">← Back</button>

        <h1 class="level-title">Choose Your Level</h1>
        <p class="level-subtitle">Select the difficulty you want to play:</p>

        <div class="level-buttons">
            <button class="level-btn easy">Easy (180s)</button>
            <button class="level-btn medium">Medium (120s)</button>
            <button class="level-btn hard">Hard (90s)</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
